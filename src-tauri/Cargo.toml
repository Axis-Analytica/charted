[package]
name = "charted"
description = "A lightweight, local-first Power BI Desktop alternative for Omarchy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
charted-core.workspace = true
charted-agent.workspace = true
# Without the development WebSocket server: release builds never listen on a port.
charted-cli = { path = "../crates/cli", default-features = false }
charted-engine.workspace = true
duckdb.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "file_chooser"] }
# Must match the GTK stack Tauri links (see Cargo.lock): used to set the Wayland app id
# and to snapshot the webview for `--screenshot`.
glib = "0.18"
gtk = "0.18"
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", features = ["png"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[features]
# Release builds serve the UI from the binary instead of the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
