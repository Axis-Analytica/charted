[package]
name = "charted-core"
description = "charted's application core: projects, sessions, the request API and Omarchy integration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
charted-model.workspace = true
charted-ossie = { workspace = true, features = ["schema"] }
charted-compiler.workspace = true
charted-dax.workspace = true
charted-tmdl.workspace = true
charted-engine.workspace = true
charted-samplegen.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml.workspace = true
notify.workspace = true
ts-rs.workspace = true
uuid = { version = "1", features = ["v4", "v5"] }
# Excel sheets are read in pure Rust (no DuckDB extension, no network).
calamine = "0.37"
# .chartedz bundles (the same zip calamine uses).
zip = { version = "9", default-features = false, features = ["deflate"] }
# The family names of fonts the user adds.
ttf-parser = "0.25"
dirs = "7"
# Canonical paths without Windows' \\?\ prefix, which DuckDB and users don't expect.
dunce = "1"

# PostgreSQL passwords live in the system keyring, not in projects: Secret Service on
# Linux, the Keychain on macOS, the Credential Manager on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
arrow-ipc.workspace = true
arrow-cast.workspace = true
insta.workspace = true
notify.workspace = true
tempfile = "3"
rust_xlsxwriter = { version = "0.101", default-features = false }
