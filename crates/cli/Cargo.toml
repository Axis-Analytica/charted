[package]
name = "charted-cli"
description = "charted's command line: commands that need no display, for scripts and agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

# A display-free build of the CLI for CI and tests; the shipped `charted` binary embeds
# the same commands alongside the GUI.
[[bin]]
name = "charted-headless"
path = "src/main.rs"

[dependencies]
charted-core.workspace = true
charted-engine.workspace = true
charted-samplegen.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tungstenite = { version = "0.29", optional = true }

[features]
default = ["dev-server"]
# `charted serve --dev`: the request API over a local WebSocket, so the UI can run in a
# browser for end-to-end tests. Not built into release packages.
dev-server = ["dep:tungstenite"]
