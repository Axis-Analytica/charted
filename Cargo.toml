[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "1.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Axis-Analytica/charted"
rust-version = "1.90"

[workspace.dependencies]
# DuckDB 2.0. How it is linked is chosen by charted-engine's features: development
# builds download DuckDB's official prebuilt library (which includes the Parquet and
# JSON readers); `duckdb-bundled` compiles DuckDB from source instead.
duckdb = { version = "1.20000.0" }
# Must match the arrow major version duckdb re-exports as `duckdb::arrow`.
arrow-ipc = "60"
arrow-cast = "60"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
toml = "1"
notify = "8"
clap = { version = "4.6", features = ["derive", "env"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
rand = "0.10"
rand_chacha = "0.10"
insta = { version = "1.49", features = ["yaml"] }
proptest = "1.12"
jsonschema = { version = "0.60", default-features = false }
tauri = { version = "2.12" }
tauri-build = { version = "2.7" }

charted-model = { path = "crates/model" }
charted-ossie = { path = "crates/ossie" }
charted-compiler = { path = "crates/compiler" }
charted-dax = { path = "crates/dax" }
charted-tmdl = { path = "crates/tmdl" }
charted-engine = { path = "crates/engine" }
charted-core = { path = "crates/core" }
charted-agent = { path = "crates/agent" }
charted-samplegen = { path = "crates/samplegen" }

[profile.dev]
# Line tables keep backtraces useful while cutting link-time memory.
debug = "line-tables-only"

# When DuckDB is compiled from source, an unoptimised build is unbearably slow.
[profile.dev.package.libduckdb-sys]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
