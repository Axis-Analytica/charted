# This machine (and many laptops) have little RAM; DuckDB's bundled C++ build
# peaks at several GB per job, so keep parallelism modest by default.
[build]
jobs = 3

[env]
# ts-rs writes TypeScript bindings for API types here when `cargo test` runs.
TS_RS_EXPORT_DIR = { value = "ui/src/bridge/generated", relative = true }

# Development builds link DuckDB's prebuilt shared library (downloaded by libduckdb-sys
# into target/duckdb-download). The first rpath finds it from target/{debug,release};
# the second is where the installed package puts it (/usr/lib/charted).
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN/../duckdb-download/aarch64-unknown-linux-gnu/v2.0.0:$ORIGIN/../lib/charted"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN/../duckdb-download/x86_64-unknown-linux-gnu/v2.0.0:$ORIGIN/../lib/charted"]
