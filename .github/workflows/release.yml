name: Release

# A version tag (v1.0.0) builds the release tarballs on both architectures, and the
# macOS and Windows installers (unsigned previews for now), and attaches them, with
# their checksums, to a draft GitHub release. Run by hand, or on a pull request that
# changes the packaging, it only builds them, as workflow artifacts to try.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/**
      - crates/agent/**
      - .cargo/config.toml

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libsoup-3.0-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        run: |
          printf 'export PATH="$HOME/.cargo/bin:$PATH"\n' > bin/env
          bin/release
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.runner }}
          path: target/dist/charted-*.tar.gz

  desktop:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One app for Apple silicon and Intel Macs (DuckDB's library is universal).
          - os: macos-15
            triple: aarch64-apple-darwin
            lib: libduckdb.dylib
            target: universal-apple-darwin
            bundle: universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            lib: duckdb.dll
            bundle: release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ matrix.target && ',aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # DuckDB's prebuilt library, downloaded by the engine's build, goes inside the
      # app: Contents/Frameworks on macOS, next to charted.exe on Windows.
      - name: DuckDB
        run: |
          cargo build --release -p charted-engine
          mkdir -p src-tauri/lib
          cp "target/duckdb-download/${{ matrix.triple }}/v2.0.0/${{ matrix.lib }}" src-tauri/lib/
      - name: Build
        run: |
          pnpm -C ui install --frozen-lockfile
          cd src-tauri && ../ui/node_modules/.bin/tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Check the app finds DuckDB
        if: runner.os == 'macOS'
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/charted.app
          lipo -info "$app/Contents/MacOS/charted" "$app/Contents/Frameworks/libduckdb.dylib"
          otool -L "$app/Contents/MacOS/charted" | grep -i duckdb
          otool -l "$app/Contents/MacOS/charted" | grep -A2 LC_RPATH
          ls "$app/Contents/Frameworks"
          "$app/Contents/MacOS/charted" --version
      - name: Check the app finds DuckDB
        if: runner.os == 'Windows'
        run: |
          cp src-tauri/lib/duckdb.dll target/release/
          target/release/charted.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: target/${{ matrix.bundle }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum charted-*.tar.gz *.dmg *.msi > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
