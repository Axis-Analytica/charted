name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the desktop shell
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: WebAssembly-compatible crates stay free of native dependencies
        run: cargo check --target wasm32-unknown-unknown -p charted-model -p charted-compiler -p charted-ossie -p charted-dax
      - name: TypeScript bindings are up to date
        run: git diff --exit-code -- ui/src/bridge/generated

  ui:
    name: UI and end-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (the keyring talks D-Bus)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The DAX editor's language service (ui/src/dax/pkg); the version must match
      # wasm-bindgen in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - name: Build the DAX language service
        run: |
          cargo build --release --target wasm32-unknown-unknown -p charted-wasm
          wasm-bindgen --target web --out-dir ui/src/dax/pkg target/wasm32-unknown-unknown/release/charted_wasm.wasm
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm exec tsc --noEmit
        working-directory: ui
      - run: node tools/i18n-strings.mjs --check
      - name: Build the dev server
        run: |
          cargo build -p charted-cli
          # The Rust cache can drop DuckDB's downloaded library while keeping the build
          # script's result; fetch it again if so.
          if [ -z "$(find target -name libduckdb.so -print -quit)" ]; then
            cargo clean -p libduckdb-sys
            cargo build -p charted-cli
          fi
          echo "LD_LIBRARY_PATH=$(dirname "$(find "$PWD/target" -name libduckdb.so -print -quit)")" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ui
      - run: pnpm exec playwright test
        working-directory: ui
      - name: Keep the end-to-end results of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: ui/test-results
          retention-days: 7
