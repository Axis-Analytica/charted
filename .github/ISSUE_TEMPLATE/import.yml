name: Power BI import or export
description: Something didn't come across from Power BI, or an export doesn't open in Power BI Desktop.
labels: [interop]
body:
  - type: markdown
    attributes:
      value: "What comes across today is listed in [docs/powerbi.md](https://github.com/Axis-Analytica/charted/blob/main/docs/powerbi.md)."
  - type: dropdown
    id: direction
    attributes:
      label: Direction
      options: [Importing into charted, Exporting to Power BI]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What didn't come across
      description: The feature (a visual type, an M step, a DAX function…), and what you expected.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Import report
      description: "Paste the import report (or the output of `charted import-pbip <file> --json`)."
      render: json
  - type: textarea
    id: sample
    attributes:
      label: A sample
      description: A small PBIP or model.bim that shows it, if you can share one (zip it and drop it here). Remove anything confidential.
  - type: input
    id: version
    attributes:
      label: charted version
      placeholder: "1.5.0"
